<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Metaslice</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48">
<meta name="theme-color" content="#0A0C14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0C14;--ink:#ECEAF3;--muted:#98A0BE;--gold:#D9A441;--edge:#262C45;--panel:#141827}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background-image:radial-gradient(900px 520px at 70% -10%, rgba(217,164,65,.16), transparent 62%),
                     radial-gradient(760px 480px at 6% 110%, rgba(31,169,140,.13), transparent 60%);
    -webkit-font-smoothing:antialiased;
  }
  .card{max-width:460px;text-align:center}
  svg.mark{width:76px;height:76px;margin-bottom:22px}
  h1{font-family:'Chakra Petch',system-ui,sans-serif;font-size:clamp(30px,7vw,42px);margin:0 0 6px;letter-spacing:.01em}
  .code{font-family:'Chakra Petch',monospace;color:var(--gold);letter-spacing:.22em;font-size:12px;text-transform:uppercase;margin-bottom:14px}
  p{color:var(--muted);line-height:1.6;margin:0 0 26px}
  a.btn{
    display:inline-block;padding:11px 20px;border-radius:10px;text-decoration:none;font-weight:600;
    background:linear-gradient(180deg,#e6b95a,var(--gold));color:#20170A;border:1px solid #a87f2b;
  }
  a.btn:hover{filter:brightness(1.06)}
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="1.2" y="1.2" width="61.6" height="61.6" rx="15" fill="#0F1324"/>
      <rect x="2.2" y="2.2" width="59.6" height="59.6" rx="13.6" fill="none" stroke="#D9A441" stroke-opacity=".28" stroke-width="1.1"/>
      <g stroke="#0F1324" stroke-width="2.4" stroke-linejoin="round">
        <path d="M32 32 L32 12.5 A19.5 19.5 0 0 1 46.94 44.53 Z" fill="#E0B151"/>
        <path d="M32 32 L46.94 44.53 A19.5 19.5 0 0 1 12.80 28.61 Z" fill="#25B294"/>
        <path d="M32 32 L12.80 28.61 A19.5 19.5 0 0 1 32 12.5 Z" fill="#C8608C" transform="translate(-1.93 -2.30)"/>
      </g>
    </svg>
    <div class="code">Error 404</div>
    <h1>That slice isn't here</h1>
    <p>Whatever you were after has been cut from the list. Metaslice is a single page, so the chart builder is always one click away.</p>
    <a class="btn" href="/">Back to the chart builder</a>
  </div>
</body>
</html>
