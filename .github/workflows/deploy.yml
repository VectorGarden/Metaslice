name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by refresh-archetype-index.yml. A push made with GITHUB_TOKEN does
  # not start another workflow, so a refreshed index would otherwise sit in the
  # repository undeployed until something else was pushed.
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit to publish. A caller that has just pushed must name it:
          github.sha is fixed when the run starts, so it still points at the
          commit that triggered the run and the new one would not be deployed.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Let a production deploy run to completion rather than cancelling it; runs that
# queue up behind it collapse to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/configure-pages@v6
      # No build step — the repository is the site. Still, a few things in it
      # are not: stage a copy without them rather than serving the whole repo.
      # Anything added later ships by default; only what is listed here does not.
      # CNAME is deliberately not excluded, or the custom domain would be reset.
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --exclude '_site/' --exclude '.git/' --exclude '.github/' --exclude 'tools/' ./ _site/
          echo "Shipping:" && ls -A _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

      # deploy-pages reporting success only means the artifact was accepted. It
      # published the wrong commit once while reporting success (#11), and the
      # deployments list is attributed to the triggering commit, so neither is
      # evidence of what the site actually serves. Ask the site.
      #
      # This runs after publication, so it cannot prevent a bad deploy — it
      # turns one into a failed run instead of something nobody notices until
      # the fallback is needed. Runners reach the site freely, which the cloud
      # sandbox the monthly check runs in does not.
      - name: Verify the live site serves what was deployed
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -uo pipefail
          FILES="index.html data/archetype-art.js"
          for f in $FILES; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::_site/$f is missing — the staged tree is not what it should be"
              exit 1
            fi
          done

          base="${SITE%/}"
          echo "Checking $base"
          for attempt in $(seq 1 12); do
            bad=""
            for f in $FILES; do
              live="/tmp/live-$(echo "$f" | tr / _)"
              # A fresh query each attempt so a cached copy cannot pass for a live one.
              if ! curl -fsS --max-time 30 "$base/$f?v=$GITHUB_RUN_ID-$attempt" -o "$live"; then
                bad="$f (could not be fetched)"; break
              fi
              if ! cmp -s "$live" "_site/$f"; then
                bad="$f (served $(wc -c <"$live" | tr -d ' ') bytes, deployed $(wc -c <"_site/$f" | tr -d ' '))"; break
              fi
            done
            if [ -z "$bad" ]; then
              echo "All checked files match what was deployed (attempt $attempt)."
              echo "Live site matches the deployed commit." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: $bad — waiting for the CDN"
            sleep 10
          done

          echo "::error::$bad — the site is not serving what this run deployed"
          {
            echo "### Live site does not match the deploy"
            echo
            echo "Last mismatch: \`$bad\`"
            echo
            echo "The artifact was accepted but the site is serving something else."
            echo "Check which ref the checkout step used — this is how #11 presented."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
