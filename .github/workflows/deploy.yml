name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by refresh-archetype-index.yml. A push made with GITHUB_TOKEN does
  # not start another workflow, so a refreshed index would otherwise sit in the
  # repository undeployed until something else was pushed.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a production deploy run to completion rather than cancelling it; runs that
# queue up behind it collapse to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # No build step — the repository is the site. Hidden files are left out by
      # default and .github is excluded regardless, so only the site itself is
      # uploaded. CNAME is not hidden, so the custom domain survives the deploy.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
